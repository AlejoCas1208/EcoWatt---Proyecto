{% extends "base.html" %}
{% block title %}EcoWatt - Editar Factura{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="mb-3">Actualizar Factura y Consumo</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Consumo Actual (kWh)</label>
                    <input type="number" step="any" class="form-control" name="consumo" value="{{ user.consumo_actual }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Costo Total (COP)</label>
                    <input type="number" step="any" class="form-control" name="costo" value="{{ user.costo_actual }}" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Factura</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
