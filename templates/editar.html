{% extends "base.html" %}
{% block title %}EcoWatt - Editar Electrodoméstico{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="mb-3">Editar Electrodoméstico</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" name="name" value="{{ appliance.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Potencia (Watts)</label>
                    <input type="number" step="any" class="form-control" name="power" value="{{ appliance.power }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Horas de uso diario</label>
                    <input type="number" step="any" class="form-control" name="hours" value="{{ appliance.hours }}" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('appliances') }}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Actualizar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
